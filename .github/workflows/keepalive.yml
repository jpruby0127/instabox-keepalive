name: instabox-keepalive

# 每 10 分钟访问一次机器的公开探针 URL。
# GitHub 的定时触发不依赖你的电脑，仓库和 Actions 对个人账号永久免费。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping probe
        run: bash keepalive.sh
