name: instabox-keepalive

# 每 10 分钟访问一次机器的公开探针 URL。
#
# cron 刻意不用 */10：GitHub 的调度器在整点和半点最拥堵，延迟可达 15~45 分钟，
# 而 InstaBox 的空闲上限只有 30 分钟。所以用错峰的 3/13/23/33/43/53 分，
# 避开 0 分和 30 分的调度高峰。
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping probe
        run: bash keepalive.sh
